# Local development stack.
#
# This composes a working platform for development and integration testing. It is
# not a production topology: production runs managed PostgreSQL with encryption at
# rest, automated backups and point-in-time recovery, Redis in a replicated
# configuration, and the API behind the state's API gateway. See
# docs/deployment.md.

name: pcid

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: pcid
      POSTGRES_PASSWORD: pcid-local-development
      POSTGRES_DB: pcid
      # Checksums catch silent corruption; the production cluster runs with them.
      POSTGRES_INITDB_ARGS: '--data-checksums'
    ports: ['5432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pcid -d pcid']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ['node', 'services/api/dist/database/migrate-cli.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://pcid:pcid-local-development@postgres:5432/pcid
      DATABASE_SSL: require
      TOKEN_SIGNING_KEY: ${TOKEN_SIGNING_KEY:?set TOKEN_SIGNING_KEY}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?set SECRET_ENCRYPTION_KEY}
      ALLOW_SANDBOX_ADAPTERS: 'false'
    depends_on:
      postgres: { condition: service_healthy }
    restart: on-failure

  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgres://pcid:pcid-local-development@postgres:5432/pcid
      DATABASE_SSL: require
      REDIS_URL: redis://redis:6379
      TOKEN_SIGNING_KEY: ${TOKEN_SIGNING_KEY:?set TOKEN_SIGNING_KEY}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?set SECRET_ENCRYPTION_KEY}
      PLATFORM_BASE_URL: http://localhost:3000
      ALLOW_SANDBOX_ADAPTERS: 'false'
    ports: ['3000:3000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    read_only: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']

  # The notification delivery worker: the same image as the API with a different
  # command. It serves no HTTP, opens no port and holds no session; it claims
  # messages with FOR UPDATE SKIP LOCKED, so the number of replicas is an
  # operational decision rather than a correctness one.
  notification-worker:
    build: .
    command: ['node', 'services/api/dist/notifications/notification-worker-cli.js']
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://pcid:pcid-local-development@postgres:5432/pcid
      DATABASE_SSL: require
      TOKEN_SIGNING_KEY: ${TOKEN_SIGNING_KEY:?set TOKEN_SIGNING_KEY}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?set SECRET_ENCRYPTION_KEY}
      ALLOW_SANDBOX_ADAPTERS: 'false'
      # With no gateway configured and sandbox adapters refused, the worker
      # reports every message as having no sender rather than logging it and
      # claiming success. That is the safe direction: a hundred per cent
      # delivery rate that is really a log file is worse than an obvious failure.
      SMS_GATEWAY_URL: ${SMS_GATEWAY_URL:-}
      EMAIL_GATEWAY_URL: ${EMAIL_GATEWAY_URL:-}
      NOTIFICATION_GATEWAY_TOKEN: ${NOTIFICATION_GATEWAY_TOKEN:-}
      NOTIFICATION_WORKER_INTERVAL_SECONDS: 30
      NOTIFICATION_WORKER_BATCH_SIZE: 25
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    read_only: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']

  # The retention sweep: the same image again, applying the schedule nightly.
  #
  # It is here rather than left to an operator's cron because "nobody ran it" is
  # the failure this whole phase exists to fix - the periods were in the privacy
  # notice for eleven phases and nothing applied them. A compose file that starts
  # the API and the notification worker but leaves the schedule to be remembered
  # would be making the same mistake in a different place.
  retention-worker:
    build: .
    command: ['node', 'services/api/dist/retention/retention-worker-cli.js']
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://pcid:pcid-local-development@postgres:5432/pcid
      DATABASE_SSL: require
      TOKEN_SIGNING_KEY: ${TOKEN_SIGNING_KEY:?set TOKEN_SIGNING_KEY}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?set SECRET_ENCRYPTION_KEY}
      ALLOW_SANDBOX_ADAPTERS: 'false'
      # Nightly: the periods are measured in days, and an hourly sweep buys hours
      # at the cost of a write burst against tables that are busy all day.
      RETENTION_WORKER_INTERVAL_SECONDS: 86400
      # Below the catalogue ceiling, so a first sweep against an existing backlog
      # is worked off over several runs rather than attempted in one statement.
      RETENTION_BATCH_SIZE: 1000
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    read_only: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']

  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3100
      # Server-side only: the browser never calls the API directly, so this stays
      # on the internal network.
      PCID_API_URL: http://api:3000
      # A third key, distinct from the API's two. The portal seals the resident's
      # session cookie with it and holds nothing else.
      PORTAL_SESSION_KEY: ${PORTAL_SESSION_KEY:?set PORTAL_SESSION_KEY}
      PORTAL_SESSION_TTL_SECONDS: 1800
      # Server Actions are rejected unless the submission came from here.
      PORTAL_ALLOWED_ORIGINS: http://localhost:3100
    ports: ['3100:3100']
    depends_on:
      api: { condition: service_started }
    read_only: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']

  government-portal:
    build:
      context: .
      dockerfile: apps/government/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3200
      PCID_API_URL: http://api:3000
      # A fourth key. Each portal seals its own session cookie, so a compromise
      # of one does not produce a usable cookie for the other.
      GOVERNMENT_PORTAL_SESSION_KEY: ${GOVERNMENT_PORTAL_SESSION_KEY:?set GOVERNMENT_PORTAL_SESSION_KEY}
      # Shorter than the citizen portal's: a resident's session is open on their
      # own phone, an officer's on a shared counter machine.
      GOVERNMENT_PORTAL_SESSION_TTL_SECONDS: 900
      GOVERNMENT_PORTAL_ALLOWED_ORIGINS: http://localhost:3200
    ports: ['3200:3200']
    depends_on:
      api: { condition: service_started }
    read_only: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']

  security-portal:
    build:
      context: .
      dockerfile: apps/security/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3300
      PCID_API_URL: http://api:3000
      # A fifth key. Each portal seals its own session cookie, so a compromise of
      # one does not produce a usable cookie for any other.
      SECURITY_PORTAL_SESSION_KEY: ${SECURITY_PORTAL_SESSION_KEY:?set SECURITY_PORTAL_SESSION_KEY}
      # The shortest of the three. What is reachable from here is case-bound
      # access to the register under a criminal-investigation purpose, on a
      # machine in a command room somebody else can walk into.
      SECURITY_PORTAL_SESSION_TTL_SECONDS: 600
      SECURITY_PORTAL_ALLOWED_ORIGINS: http://localhost:3300
    ports: ['3300:3300']
    depends_on:
      api: { condition: service_started }
    read_only: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']

  emergency-portal:
    build:
      context: .
      dockerfile: apps/emergency/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3400
      PCID_API_URL: http://api:3000
      # A sixth key. Each portal seals its own session cookie, so a compromise of
      # one does not produce a usable cookie for any other.
      EMERGENCY_PORTAL_SESSION_KEY: ${EMERGENCY_PORTAL_SESSION_KEY:?set EMERGENCY_PORTAL_SESSION_KEY}
      # Twelve hours, and the longest of the four — deliberately. A crew locked
      # out mid-job writes the passphrase on the dashboard. What keeps the risk
      # down here is the reach, not the timeout.
      EMERGENCY_PORTAL_SESSION_TTL_SECONDS: 43200
      EMERGENCY_PORTAL_ALLOWED_ORIGINS: http://localhost:3400
    ports: ['3400:3400']
    depends_on:
      api: { condition: service_started }
    read_only: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']

volumes:
  postgres-data:
